name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: pytest tests -q -m "not e2e and not live and not smoke"
      - run: npm ci
        working-directory: src/frontend
      - run: npx eslint .
        working-directory: src/frontend
      - run: npm run build
        working-directory: src/frontend
  smoke:
    # Browser tests that need no model: sign in, wrong password, navigation, access, empty states. Real-model runs stay local.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: src/frontend
      - run: python -m pytest tests/e2e/test_smoke.py -v -m smoke
